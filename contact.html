<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="contact-page">
<!-- هنا الشريط العلوي لا تغيريه -->
   <header class="site-header" style="direction: ltr;">
    <div class="header-inner">

        <a href="index.html" class="brand">
            <img src="animals-image1.png" alt="شعار المشروع" class="logo-img">
            <div class="brand-text">
               <span class="brand-name">MA'WA</span>
                <span class="brand-tag">Every Paw Deservse a Home</span>
            </div>
        </a>

        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="animals.html">Animals</a></li>
                <li><a href="news.html">News</a></li>
                <li><a href="quiz.html">Quiz</a></li>
            </ul>
        </nav>

        <a href="contact.html" class="header-btn">Contact Us</a>

    </div>
</header>
<!--  الي هنا -->

    <main>
        <h1>Contact Us</h1>
        <div class="card">
            <form id="contactForm">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name">
                <span id="nameError" style="color:#b03a3a"></span>

                <label for="email">Email</label>
                <input type="email" id="email" placeholder="example@mail.com">
                <span id="emailError" style="color:#b03a3a"></span>

                <label for="phone">Mobile</label>
                <input type="text" id="phone" maxlength="10" placeholder="05XXXXXXXX">
                <span id="phoneError" style="color:#b03a3a"></span>

                <label for="category">Category</label>
                <select id="category">
                    <option value="">-- Select --</option>
                    <option value="adoption">Adoption Inquiry</option>
                    <option value="volunteer">Volunteering</option>
                    <option value="complaint">Complaint</option>
                    <option value="other">Other</option>
                </select>
                <span id="categoryError" style="color:#b03a3a"></span>

                <label for="msg">Message</label>
                <textarea id="msg" rows="5" placeholder="Write your message here"></textarea>
                <span id="msgError" style="color:#b03a3a"></span>

                <button type="submit">Send</button>
                <button type="reset" id="resetBtn">Clear</button>
            </form>
        </div>

        <div class="card">
            <h2>Contact Information</h2>
            <p>Address: Tabuk, Saudi Arabia</p>
            <p>Mobile: 05XXXXXXXX</p>
            <p>Email: info@mawa.com</p>
        </div>
    </main>

    <footer>
        <p id="dateTime"></p>
    </footer>

    <script>
        var form = document.getElementById("contactForm");

        form.addEventListener("submit", function (e) {
            e.preventDefault();

            var name = document.getElementById("name").value.trim();
            var email = document.getElementById("email").value.trim();
            var phone = document.getElementById("phone").value.trim();
            var category = document.getElementById("category").value;
            var msg = document.getElementById("msg").value.trim();

            var ok = true;

            // Name
            if (name.length < 3) {
                document.getElementById("nameError").textContent = "Please enter your full name (at least 3 characters)";
                ok = false;
            } else {
                document.getElementById("nameError").textContent = "";
            }

            // Email
            var emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailPattern.test(email)) {
                document.getElementById("emailError").textContent = "Please enter a valid email address";
                ok = false;
            } else {
                document.getElementById("emailError").textContent = "";
            }

            // Mobile
            var phonePattern = /^05[0-9]{8}$/;
            if (!phonePattern.test(phone)) {
                document.getElementById("phoneError").textContent = "Mobile must start with 05 and be 10 digits";
                ok = false;
            } else {
                document.getElementById("phoneError").textContent = "";
            }

            // Category
            if (category === "") {
                document.getElementById("categoryError").textContent = "Please select a category";
                ok = false;
            } else {
                document.getElementById("categoryError").textContent = "";
            }

            // Message
            if (msg.length < 10) {
                document.getElementById("msgError").textContent = "Message is too short (at least 10 characters)";
                ok = false;
            } else {
                document.getElementById("msgError").textContent = "";
            }

            // If everything is valid
            if (ok) {
                alert("Thank you, " + name + "! Your message has been sent successfully.");
                form.reset();
            }
        });

        // Clear button also removes error messages
        document.getElementById("resetBtn").addEventListener("click", function () {
            var errors = ["nameError", "emailError", "phoneError", "categoryError", "msgError"];
            for (var i = 0; i < errors.length; i++) {
                document.getElementById(errors[i]).textContent = "";
            }
        });

        // Current date and time in the footer
        function showDate() {
            var now = new Date();
            document.getElementById("dateTime").textContent = now.toLocaleString("en-US");
        }
        showDate();
        setInterval(showDate, 1000);
    </script>

</body>
</html>
